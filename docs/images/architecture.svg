<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#232f3e">vProfile: AWS Lift and Shift Architecture</text>

  <!-- User -->
  <rect x="245" y="70" width="140" height="50" rx="8" fill="#eef2f7" stroke="#555"/>
  <text x="315" y="100" text-anchor="middle" font-size="14">User / Browser</text>

  <!-- AWS Cloud -->
  <rect x="20" y="150" width="960" height="470" rx="12" fill="#fafafa" stroke="#232f3e" stroke-width="2"/>
  <text x="34" y="170" font-size="13" font-weight="bold" fill="#232f3e">AWS Cloud (VPC)</text>

  <!-- LB SG -->
  <rect x="185" y="180" width="260" height="95" rx="8" fill="none" stroke="#c0392b" stroke-dasharray="6,4"/>
  <text x="195" y="194" font-size="11" fill="#c0392b">LB Security Group (HTTP 80 / HTTPS 443)</text>
  <rect x="205" y="205" width="220" height="55" rx="8" fill="#ffe8cc" stroke="#e67e22" stroke-width="2"/>
  <text x="315" y="229" text-anchor="middle" font-size="14" font-weight="bold">Application Load Balancer</text>
  <text x="315" y="247" text-anchor="middle" font-size="11" fill="#555">HTTP :80 · stickiness on</text>

  <line x1="315" y1="120" x2="315" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="325" y="150" font-size="11" fill="#333">HTTP via ALB DNS name</text>

  <!-- ASG -->
  <rect x="185" y="310" width="460" height="125" rx="8" fill="none" stroke="#2980b9" stroke-dasharray="6,4"/>
  <text x="195" y="426" font-size="11" fill="#2980b9">Auto Scaling Group (min 1 · max 4) · App Security Group (8080 from LB SG)</text>
  <rect x="205" y="330" width="200" height="70" rx="8" fill="#dbeafe" stroke="#2980b9" stroke-width="2"/>
  <text x="305" y="358" text-anchor="middle" font-size="14" font-weight="bold">EC2 · Tomcat (app01)</text>
  <text x="305" y="378" text-anchor="middle" font-size="11" fill="#555">Ubuntu · t2.micro · :8080</text>
  <rect x="425" y="330" width="200" height="70" rx="8" fill="#dbeafe" stroke="#2980b9" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="525" y="358" text-anchor="middle" font-size="14" font-weight="bold">EC2 · Tomcat (scaled)</text>
  <text x="525" y="378" text-anchor="middle" font-size="11" fill="#555">from launch template</text>

  <line x1="305" y1="260" x2="305" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="260" x2="500" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="300" font-size="11" fill="#333">:8080</text>

  <!-- S3 -->
  <rect x="35" y="335" width="130" height="60" rx="8" fill="#e6f4ea" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="360" text-anchor="middle" font-size="14" font-weight="bold">S3 Bucket</text>
  <text x="100" y="378" text-anchor="middle" font-size="11" fill="#555">vprofile-v2.war</text>
  <line x1="165" y1="365" x2="205" y2="365" stroke="#333" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="100" y="415" text-anchor="middle" font-size="11" fill="#555">pulled via IAM role</text>

  <!-- Route 53 -->
  <rect x="720" y="330" width="230" height="70" rx="8" fill="#f3e8ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="835" y="358" text-anchor="middle" font-size="14" font-weight="bold">Route 53 Private Zone</text>
  <text x="835" y="378" text-anchor="middle" font-size="11" fill="#555">vprofile.in · db01 / mc01 / rmq01</text>
  <line x1="645" y1="365" x2="720" y2="365" stroke="#333" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="682" y="357" text-anchor="middle" font-size="10" fill="#333">DNS</text>

  <!-- Backend SG -->
  <rect x="185" y="480" width="640" height="115" rx="8" fill="none" stroke="#c0392b" stroke-dasharray="6,4"/>
  <text x="195" y="588" font-size="11" fill="#c0392b">Backend Security Group (3306 · 11211 · 5672 from App SG)</text>
  <rect x="205" y="500" width="180" height="60" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="295" y="525" text-anchor="middle" font-size="14" font-weight="bold">db01 · MySQL</text>
  <text x="295" y="543" text-anchor="middle" font-size="11" fill="#555">:3306</text>
  <rect x="415" y="500" width="180" height="60" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="505" y="525" text-anchor="middle" font-size="14" font-weight="bold">mc01 · Memcache</text>
  <text x="505" y="543" text-anchor="middle" font-size="11" fill="#555">:11211</text>
  <rect x="625" y="500" width="180" height="60" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="715" y="525" text-anchor="middle" font-size="14" font-weight="bold">rmq01 · RabbitMQ</text>
  <text x="715" y="543" text-anchor="middle" font-size="11" fill="#555">:5672</text>

  <line x1="505" y1="435" x2="505" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="470" font-size="11" fill="#333">by private DNS name</text>
  <line x1="835" y1="400" x2="835" y2="450" stroke="#333" stroke-dasharray="5,4"/>
  <line x1="835" y1="450" x2="770" y2="450" stroke="#333" stroke-dasharray="5,4"/>
  <line x1="770" y1="450" x2="770" y2="500" stroke="#333" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="845" y="440" font-size="10" fill="#333">private IPs</text>
</svg>
